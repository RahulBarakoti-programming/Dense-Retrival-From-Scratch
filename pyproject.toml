[project]
name = "dense-retrival-model-from-scratch"
version = "0.1.0"
description = "A dense retrieval system built from scratch with PyTorch and contrastive learning."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dense_retrieval"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
